[workspace]
members = [
    "crates/physics-dsp",
    "crates/physics-ui",
    "crates/physics-piano",
    "crates/physics-guitar",
    "crates/physics-bass",
    "crates/physics-drum",
    "crates/physics-presets",
    "crates/vizia-plug",
    "xtask"
]
resolver = "3"

[patch.crates-io]
# Local build copies for these changes; their minimal upstream deltas live in patches/upstream-resize/.
nice-plug = { path = "vendor/nice-plug" }

[workspace.package]
version = "0.4.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
split-debuginfo = "unpacked"
debug = 1
