name: CI, CLAP & VST3 Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies (ALSA, JACK, X11, Wayland, OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-sync-dev \
            libxshmfence-dev \
            libxcursor-dev \
            libxkbcommon-dev
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Run unit & integration tests
        run: cargo test --workspace

      - name: Bundle piano CLAP & VST3 plugins
        run: cargo xtask bundle physics-piano --release

      - name: Bundle guitar CLAP & VST3 plugins
        run: cargo xtask bundle physics-guitar --release

      - name: Bundle bass CLAP & VST3 plugins
        run: cargo xtask bundle physics-bass --release

      - name: Bundle drum CLAP & VST3 plugins
        run: cargo xtask bundle physics-drum --release

      - name: Build piano standalone executable
        run: cargo build --release -p physics-piano --bin physics-piano-standalone

      - name: Build guitar standalone executable
        run: cargo build --release -p physics-guitar --bin physics-guitar-standalone

      - name: Build bass standalone executable
        run: cargo build --release -p physics-bass --bin physics-bass-standalone

      - name: Build drum standalone executable
        run: cargo build --release -p physics-drum --bin physics-drum-standalone

      - name: Stage instrument formats separately
        shell: bash
        run: |
          mkdir -p \
            release-bundle/physics-piano \
            release-bundle/physics-guitar \
            release-bundle/physics-bass \
            release-bundle/physics-drum
          cp -R target/bundled/physics-piano.clap release-bundle/physics-piano/
          cp -R target/bundled/physics-piano.vst3 release-bundle/physics-piano/
          cp -R target/bundled/physics-guitar.clap release-bundle/physics-guitar/
          cp -R target/bundled/physics-guitar.vst3 release-bundle/physics-guitar/
          cp -R target/bundled/physics-bass.clap release-bundle/physics-bass/
          cp -R target/bundled/physics-bass.vst3 release-bundle/physics-bass/
          cp -R target/bundled/physics-drum.clap release-bundle/physics-drum/
          cp -R target/bundled/physics-drum.vst3 release-bundle/physics-drum/

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/physics-piano-standalone.exe release-bundle/physics-piano/
            cp target/release/physics-guitar-standalone.exe release-bundle/physics-guitar/
            cp target/release/physics-bass-standalone.exe release-bundle/physics-bass/
            cp target/release/physics-drum-standalone.exe release-bundle/physics-drum/
          else
            cp target/release/physics-piano-standalone release-bundle/physics-piano/
            cp target/release/physics-guitar-standalone release-bundle/physics-guitar/
            cp target/release/physics-bass-standalone release-bundle/physics-bass/
            cp target/release/physics-drum-standalone release-bundle/physics-drum/
          fi

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path release-bundle/physics-piano -DestinationPath release-physics-piano-${{ runner.os }}-${{ runner.arch }}.zip
          Compress-Archive -Path release-bundle/physics-guitar -DestinationPath release-physics-guitar-${{ runner.os }}-${{ runner.arch }}.zip
          Compress-Archive -Path release-bundle/physics-bass -DestinationPath release-physics-bass-${{ runner.os }}-${{ runner.arch }}.zip
          Compress-Archive -Path release-bundle/physics-drum -DestinationPath release-physics-drum-${{ runner.os }}-${{ runner.arch }}.zip

      - name: Archive Linux and macOS bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for instrument in physics-piano physics-guitar physics-bass physics-drum; do
            chmod +x "release-bundle/$instrument/$instrument-standalone"
            tar -czf "release-${instrument}-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C release-bundle "$instrument"
          done

      - name: Show sccache statistics
        run: sccache --show-stats

      - name: Upload separate instrument archives for this platform
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: release-physics-*
          if-no-files-found: error

  python-verification:
    name: Python Physics Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Run Python physics verification
        run: uv run --python 3.11 --with pytest,soundfile pytest tests/test_physics_piano.py -v

  release:
    name: Release CLAP, VST3 & Standalone Bundles
    needs: [test-and-build, python-verification]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-pkg
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-pkg/*
          draft: false
          prerelease: false
          generate_release_notes: true
