name: CI, CLAP & VST3 Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies (ALSA, JACK, X11, OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libgl1-mesa-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-glx0-dev \
            libxcursor-dev \
            libxkbcommon-dev
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Run unit & integration tests
        run: cargo test --workspace

      - name: Bundle release CLAP & VST3 plugins
        run: cargo xtask bundle physics-piano --release

      - name: Build standalone playable executable
        run: cargo build --release -p physics-piano --bin physics-piano-standalone

      - name: Show sccache statistics
        run: sccache --show-stats

      - name: Upload CLAP Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-piano-${{ matrix.os }}-clap
          path: target/bundled/physics-piano.clap
          if-no-files-found: error

      - name: Upload VST3 Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-piano-${{ matrix.os }}-vst3
          path: target/bundled/physics-piano.vst3
          if-no-files-found: error

      - name: Upload Standalone Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-piano-${{ matrix.os }}-standalone
          path: |
            target/release/physics-piano-standalone
            target/release/physics-piano-standalone.exe
          if-no-files-found: ignore

  python-verification:
    name: Python Physics Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Run Python physics verification
        run: uv run --python 3.11 --with pytest,soundfile pytest tests/test_physics_piano.py -v

  release:
    name: Release CLAP, VST3 & Standalone Bundles
    needs: [test-and-build, python-verification]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Release Archives
        run: |
          mkdir -p release-pkg
          cd artifacts
          for dir in physics-piano-*; do
            if [ -d "$dir" ]; then
              if [[ "$dir" == *"windows"* ]]; then
                (cd "$dir" && zip -r "../../release-pkg/${dir}.zip" .)
              else
                tar -czvf "../release-pkg/${dir}.tar.gz" -C "$dir" .
              fi
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-pkg/*
          draft: false
          prerelease: false
          generate_release_notes: true

