name: CI & CLAP Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-ext: clap
            target-path: target/bundled/physics-piano.clap
          - os: macos-latest
            artifact-ext: clap
            target-path: target/bundled/physics-piano.clap
          - os: windows-latest
            artifact-ext: clap
            target-path: target/bundled/physics-piano.clap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies (ALSA, JACK, X11, OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libgl1-mesa-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-glx0-dev \
            libxcursor-dev \
            libxkbcommon-dev
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run unit & integration tests
        run: cargo test --workspace --verbose

      - name: Bundle release CLAP plugin
        run: cargo xtask bundle physics-piano --release

      - name: Build standalone playable executable
        run: cargo build --release -p physics-piano --bin physics-piano-standalone

      - name: Upload CLAP Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-piano-${{ matrix.os }}-clap
          path: ${{ matrix.target-path }}
          if-no-files-found: error

  python-verification:
    name: Python Physics Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy soundfile pytest
          pip install -e .

      - name: Run Python physics verification
        run: pytest tests/test_physics_piano.py -v

  release:
    name: Release CLAP Bundles
    needs: [test-and-build, python-verification]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Release Archives
        run: |
          mkdir -p release-pkg
          cd artifacts
          for dir in physics-piano-*-clap; do
            if [ -d "$dir" ]; then
              tar -czvf "../release-pkg/${dir}.tar.gz" -C "$dir" .
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-pkg/*
          draft: false
          prerelease: false
          generate_release_notes: true
