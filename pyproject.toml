[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-piano-experiment"
version = "0.1.0"
description = "A first-principles physical modeling piano sound synthesis engine in Python"
readme = "README.md"
authors = [{ name = "mumu-lhl" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
]

[project.scripts]
physics-piano = "physics_piano.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
