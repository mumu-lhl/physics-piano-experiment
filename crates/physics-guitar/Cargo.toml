[package]
name = "physics-guitar"
version.workspace = true
edition = "2024"
rust-version = "1.85"
authors = ["Mumulhl"]
description = "First-principles physical modeling acoustic & electric guitar synthesizer in Rust"

[lib]
name = "physics_guitar"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "physics-guitar-rs"
path = "src/bin/cli.rs"

[[bin]]
name = "physics-guitar-standalone"
path = "src/bin/standalone.rs"

[dependencies]
physics-dsp = { path = "../physics-dsp" }
physics-ui = { path = "../physics-ui" }
clap-sys = "0.5.0"
realfft = "3.5.0"
num-complex = "0.4"
hound = "3.5.1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
nice-plug = { version = "0.4.2", default-features = false, features = ["assert_process_allocs", "standalone", "vst3", "editor"] }
vizia_plug = { path = "../vizia-plug" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
physics-presets = { path = "../physics-presets" }

[dev-dependencies]
nice-assert-no-alloc = { version = "1.0", features = ["warn_debug"] }
