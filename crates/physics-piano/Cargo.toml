[package]
name = "physics-piano"
version.workspace = true
edition = "2024"
rust-version = "1.85"
authors = ["Mumulhl"]
description = "First-principles physical modeling acoustic piano synthesizer and native CLAP plugin in Rust"

[lib]
name = "physics_piano"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "physics-piano-rs"
path = "src/bin/cli.rs"

[[bin]]
name = "physics-piano-standalone"
path = "src/bin/standalone.rs"

[dependencies]
physics-dsp = { path = "../physics-dsp" }
physics-ui = { path = "../physics-ui" }
clap-sys = "0.5.0"
realfft = "3.5.0"
num-complex = "0.4"
hound = "3.5.1"
rayon = "1.12.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
log = "0.4"
nice-log = "0.2.4"
nice-plug = { version = "0.1.8", default-features = false, features = ["assert_process_allocs", "standalone", "vst3"] }
vizia_plug = { path = "../vizia-plug" }
atomic_float = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
physics-presets = { path = "../physics-presets" }

[dev-dependencies]
nice-assert-no-alloc = { version = "1.0", features = ["warn_debug"] }
