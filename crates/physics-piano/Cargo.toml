[package]
name = "physics-piano"
version = "0.1.0"
edition = "2021"
authors = ["mumu-lhl"]
description = "First-principles physical modeling acoustic piano synthesizer and native CLAP plugin in Rust"

[lib]
name = "physics_piano"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "physics-piano-rs"
path = "src/bin/cli.rs"

[dependencies]
clap-sys = "0.5.0"
realfft = "3.5.0"
num-complex = "0.4"
hound = "3.5.1"
rayon = "1.10.0"
