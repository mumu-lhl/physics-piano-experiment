[package]
name = "physics-drum"
version.workspace = true
edition = "2024"
rust-version = "1.85"
authors = ["Mumulhl"]
description = "Archived experimental physical-modeling drum kit synthesizer"

[lib]
name = "physics_drum"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "physics-drum-rs"
path = "src/bin/cli.rs"

[[bin]]
name = "physics-drum-standalone"
path = "src/bin/standalone.rs"

[[bin]]
name = "audit_voices"
path = "src/bin/audit_voices.rs"


[dependencies]
physics-dsp = { path = "../physics-dsp" }
physics-ui = { path = "../physics-ui" }
physics-presets = { path = "../physics-presets" }
crossbeam-channel = "0.5"
parking_lot = "0.12"
vizia_plug = { path = "../vizia-plug" }
hound = "3.5.1"
nice-plug = { version = "0.4.2", default-features = false, features = ["assert_process_allocs", "standalone", "vst3", "editor"] }

[dev-dependencies]
nice-assert-no-alloc = { version = "1.0", features = ["warn_debug"] }
